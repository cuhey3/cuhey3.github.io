<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        html {
            height: 100%;
        }

        body {
            color: white;
            background-color: black;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div>
    <svg width="500" height="500" id="mini-map" style="float: left">
        <g transform="translate(250, 250)">
            <line x1="-1000" x2="1000" y1="0" y2="0" stroke="#333"></line>
            <line y1="-1000" y2="1000" x1="0" x2="0" stroke="#333"></line>
        </g>
    </svg>
    <svg width="500" height="500" id="camera-view" style="float: left">
        <g transform="translate(250, 250)">
            <line x1="-1000" x2="1000" y1="0" y2="0" stroke="#333"></line>
            <line y1="-1000" y2="1000" x1="0" x2="0" stroke="#333"></line>
        </g>
    </svg>
</div>
<script type="module">
    import init, {FoVTest} from "./my-world/my_geometry.js?t=202410162100";

    await init();

    const fov_test = new FoVTest();
    let reference_x = -100.0;
    const reference_y = 30.0;
    fov_test.set_reference_point(reference_x, reference_y);
    fov_test.main_logic();

    let reference_point_element = document.querySelector("#reference_point");

    let mouse_x = 0;
    let mouse_y = 0;
    document.querySelector('svg#mini-map').onmousemove = function(event) {
        mouse_x = event.clientX - 250;
        mouse_y = 250 - event.clientY;
        if (fov_test.check_visibility(mouse_x, mouse_y)) {
            reference_point_element.setAttribute("fill", "blue");
        } else {
            reference_point_element.setAttribute("fill", "gray");
        }
    }

    // reference_point をクリックした位置に変更する
    // document.querySelector('svg#mini-map').onclick = function(event) {
    //   fov_test.set_reference_point(event.clientX - 250, 250 - event.clientY);
    // }

    document.querySelector('svg#mini-map').onclick = function(event) {
        fov_test.set_destination_point(event.clientX - 250, 250 - event.clientY);
    }

    function animation(elapsed_time) {
        fov_test.update_elapsed_time(elapsed_time);
        if (fov_test.check_visibility(mouse_x, mouse_y)) {
            reference_point_element.setAttribute("fill", "blue");
        } else {
            reference_point_element.setAttribute("fill", "gray");
        }
        window.requestAnimationFrame(animation);
    }
    window.requestAnimationFrame(animation);

</script>
</body>
</html>
